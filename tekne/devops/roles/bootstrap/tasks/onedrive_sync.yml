---
# ============================================
# FIRST SYNC
# ============================================

- name: Check if OneDrive has been synced before
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.stat:
    path: "{{ bootstrap_onedrive_config_dir }}/items.sqlite3"
  register: bootstrap_onedrive_db_check
  tags: [bootstrap, onedrive, sync]

- name: Display skip message if already synced
  ansible.builtin.debug:
    msg:
      - "OneDrive database already exists at {{ bootstrap_onedrive_config_dir }}/items.sqlite3"
      - "Skipping first sync - OneDrive has been synced before"
  when: bootstrap_onedrive_db_check.stat.exists
  tags: [bootstrap, onedrive, sync]

- name: Remove stale OneDrive authentication log
  ansible.builtin.file:
    path: "{{ bootstrap_onedrive_auth_log }}"
    state: absent
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Start OneDrive first sync in background
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      {{ bootstrap_onedrive_binary | quote }}
      {{ bootstrap_onedrive_sync_options }}
      --confdir={{ bootstrap_onedrive_config_dir | quote }}
      > {{ bootstrap_onedrive_auth_log | quote }} 2>&1
    executable: /bin/bash
  async: "{{ bootstrap_onedrive_sync_timeout }}"
  poll: 0
  register: bootstrap_onedrive_first_sync
  changed_when: true
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Wait for OneDrive authentication instructions
  ansible.builtin.wait_for:
    path: "{{ bootstrap_onedrive_auth_log }}"
    search_regex: 'https?://'
    timeout: 60
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Read OneDrive authentication instructions
  ansible.builtin.slurp:
    src: "{{ bootstrap_onedrive_auth_log }}"
  register: bootstrap_onedrive_auth_instructions
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Display OneDrive authentication instructions
  ansible.builtin.debug:
    msg: "{{ bootstrap_onedrive_auth_instructions.content | b64decode }}"
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Wait for user to authenticate with OneDrive
  ansible.builtin.pause:
    prompt: |

      ==========================================
      ONEDRIVE AUTHENTICATION REQUIRED
      ==========================================

      Look for the Microsoft URL and code in the output above.
      If you don't see it, check the terminal where Ansible is running.

      Steps:
        1. Go to the URL
        2. Type in the code
        3. Sign in with your Microsoft account
        4. Authorize the OneDrive application

      Press Enter AFTER done, or Ctrl+C to abort.
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Wait for OneDrive first sync to finish
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.async_status:
    jid: "{{ bootstrap_onedrive_first_sync.ansible_job_id }}"
  register: bootstrap_onedrive_sync_status
  until: bootstrap_onedrive_sync_status.finished
  retries: "{{ ((bootstrap_onedrive_sync_timeout | int) / 10) | round(0, 'ceil') | int }}"
  delay: 10
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Display sync completion message
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "OneDrive first sync completed!"
      - "Return code: {{ bootstrap_onedrive_sync_status.rc | default('N/A') }}"
      - "=========================================="
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

# ============================================
# SERVICE ENABLEMENT
# ============================================

- name: Get user UID for systemd user scope
  ansible.builtin.getent:
    database: passwd
    key: "{{ bootstrap_user }}"
  tags: [bootstrap, onedrive, service]

- name: Check if XDG_RUNTIME_DIR exists for user
  become: true
  ansible.builtin.stat:
    path: "/run/user/{{ ansible_facts.getent_passwd[bootstrap_user][1] }}"
  register: bootstrap_xdg_runtime_check
  tags: [bootstrap, onedrive, service]

- name: Create XDG_RUNTIME_DIR if it doesn't exist
  become: true
  ansible.builtin.file:
    path: "/run/user/{{ ansible_facts.getent_passwd[bootstrap_user][1] }}"
    state: directory
    owner: "{{ bootstrap_user }}"
    group: "{{ bootstrap_group }}"
    mode: '0700'
  when: not bootstrap_xdg_runtime_check.stat.exists
  tags: [bootstrap, onedrive, service]

- name: Reload systemd user daemon
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[bootstrap_user][1] }}"
  tags: [bootstrap, onedrive, service]

- name: Enable OneDrive user service
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.systemd:
    name: onedrive.service
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[bootstrap_user][1] }}"
  tags: [bootstrap, onedrive, service]

- name: Display service enabled message
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "OneDrive service enabled: onedrive.service"
      - "The service will start automatically on login"
      - "To start now: systemctl --user start onedrive.service"
      - "To check status: systemctl --user status onedrive.service"
      - "=========================================="
  tags: [bootstrap, onedrive, service]
