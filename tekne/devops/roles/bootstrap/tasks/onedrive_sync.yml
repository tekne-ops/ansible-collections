---
# ============================================
# FIRST SYNC
# ============================================

- name: Check if OneDrive has been synced before
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.stat:
    path: "{{ bootstrap_onedrive_config_dir }}/items.sqlite3"
  register: bootstrap_onedrive_db_check
  tags: [bootstrap, onedrive, sync]

- name: Read the stored OneDrive sync_list hash
  ansible.builtin.slurp:
    src: "{{ bootstrap_onedrive_config_dir }}/.sync_list.hash"
  register: bootstrap_onedrive_sync_list_hash
  failed_when: false
  changed_when: false
  when: bootstrap_onedrive_db_check.stat.exists
  tags: [bootstrap, onedrive, sync]

- name: Display skip message if already synced
  ansible.builtin.debug:
    msg:
      - "OneDrive database already exists at {{ bootstrap_onedrive_config_dir }}/items.sqlite3"
      - "Skipping first sync - OneDrive has been synced before"
  when:
    - bootstrap_onedrive_db_check.stat.exists
    - bootstrap_onedrive_sync_list_hash.content is defined
    - (bootstrap_onedrive_sync_list_hash.content | b64decode | trim) != 'initial-hash'
  tags: [bootstrap, onedrive, sync]

- name: Resync OneDrive so the installed sync_list is accepted
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.command:
    argv: "{{ [bootstrap_onedrive_binary] + (bootstrap_onedrive_sync_options.split()) + ['--confdir=' ~ bootstrap_onedrive_config_dir] }}"
  async: "{{ bootstrap_onedrive_sync_timeout }}"
  poll: 0
  register: bootstrap_onedrive_repair_sync
  when:
    - bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
    - bootstrap_onedrive_sync_list_hash.content is not defined or (bootstrap_onedrive_sync_list_hash.content | b64decode | trim) == 'initial-hash'
  tags: [bootstrap, onedrive, sync]

- name: Wait for the OneDrive sync_list resync to finish
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.async_status:
    jid: "{{ bootstrap_onedrive_repair_sync.ansible_job_id }}"
  register: bootstrap_onedrive_repair_status
  until: bootstrap_onedrive_repair_status.finished
  retries: "{{ ((bootstrap_onedrive_sync_timeout | int) / 10) | round(0, 'ceil') | int }}"
  delay: 10
  when:
    - not ansible_check_mode
    - bootstrap_onedrive_repair_sync.ansible_job_id is defined
  failed_when: bootstrap_onedrive_repair_status.finished and (bootstrap_onedrive_repair_status.rc | default(1) | int) != 0
  tags: [bootstrap, onedrive, sync]

- name: Remove stale OneDrive authentication log
  ansible.builtin.file:
    path: "{{ bootstrap_onedrive_auth_log }}"
    state: absent
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Start OneDrive first sync in background
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      {{ bootstrap_onedrive_binary | quote }}
      {{ bootstrap_onedrive_sync_options }}
      --confdir={{ bootstrap_onedrive_config_dir | quote }}
      > {{ bootstrap_onedrive_auth_log | quote }} 2>&1
    executable: /bin/bash
  async: "{{ bootstrap_onedrive_sync_timeout }}"
  poll: 0
  register: bootstrap_onedrive_first_sync
  changed_when: true
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Wait for OneDrive authentication instructions
  ansible.builtin.wait_for:
    path: "{{ bootstrap_onedrive_auth_log }}"
    search_regex: 'https?://'
    timeout: 60
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Read OneDrive authentication instructions
  ansible.builtin.slurp:
    src: "{{ bootstrap_onedrive_auth_log }}"
  register: bootstrap_onedrive_auth_instructions
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Display OneDrive authentication instructions
  ansible.builtin.debug:
    msg: "{{ bootstrap_onedrive_auth_instructions.content | b64decode }}"
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Wait for user to authenticate with OneDrive
  ansible.builtin.pause:
    prompt: |

      ==========================================
      ONEDRIVE AUTHENTICATION REQUIRED
      ==========================================

      Look for the Microsoft URL and code in the output above.
      If you don't see it, check the terminal where Ansible is running.

      Steps:
        1. Go to the URL
        2. Type in the code
        3. Sign in with your Microsoft account
        4. Authorize the OneDrive application

      Press Enter AFTER done, or Ctrl+C to abort.
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Wait for OneDrive first sync to finish
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.async_status:
    jid: "{{ bootstrap_onedrive_first_sync.ansible_job_id }}"
  register: bootstrap_onedrive_sync_status
  until: bootstrap_onedrive_sync_status.finished
  retries: "{{ ((bootstrap_onedrive_sync_timeout | int) / 10) | round(0, 'ceil') | int }}"
  delay: 10
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

- name: Display sync completion message
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "OneDrive first sync completed!"
      - "Return code: {{ bootstrap_onedrive_sync_status.rc | default('N/A') }}"
      - "=========================================="
  when:
    - not bootstrap_onedrive_db_check.stat.exists
    - not ansible_check_mode
  tags: [bootstrap, onedrive, sync]

# ============================================
# SERVICE ENABLEMENT
# ============================================

- name: Get user UID for systemd user scope
  ansible.builtin.getent:
    database: passwd
    key: "{{ bootstrap_user }}"
  tags: [bootstrap, onedrive, service]

- name: Check whether linger is already enabled
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ bootstrap_user }}"
  register: bootstrap_linger_file
  tags: [bootstrap, onedrive, service]

- name: Enable linger so the OneDrive user manager starts at boot
  ansible.builtin.command:
    argv:
      - loginctl
      - enable-linger
      - "{{ bootstrap_user }}"
  when: not bootstrap_linger_file.stat.exists
  tags: [bootstrap, onedrive, service]

- name: Start the OneDrive user manager
  ansible.builtin.systemd:
    name: "user@{{ ansible_facts.getent_passwd[bootstrap_user][1] }}.service"
    state: started
  tags: [bootstrap, onedrive, service]

- name: Reload systemd user daemon
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[bootstrap_user][1] }}"
  tags: [bootstrap, onedrive, service]

- name: Enable OneDrive user service
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.systemd:
    name: onedrive.service
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[bootstrap_user][1] }}"
  tags: [bootstrap, onedrive, service]

- name: Start OneDrive user service after sync_list resync
  become: true
  become_user: "{{ bootstrap_user }}"
  ansible.builtin.systemd:
    name: onedrive.service
    state: started
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[bootstrap_user][1] }}"
  when:
    - not ansible_check_mode
    - bootstrap_onedrive_repair_status is defined
    - not (bootstrap_onedrive_repair_status.skipped | default(false))
    - (bootstrap_onedrive_repair_status.rc | default(1) | int) == 0
  tags: [bootstrap, onedrive, service]

- name: Display service enabled message
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "OneDrive service enabled: onedrive.service"
      - "Linger is enabled, so the user manager starts at boot."
      - "To start now: systemctl --user start onedrive.service"
      - "To check status: systemctl --user status onedrive.service"
      - "=========================================="
  tags: [bootstrap, onedrive, service]
