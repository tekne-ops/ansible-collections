# Hybrid Intel+NVIDIA (ASTER): xrender avoids GLX context init flash after login.
# Keep this lean — no fade/shadow so the first paint is immediate.
backend = "xrender";
vsync = true;
unredir-if-possible = true;

fade = false;
shadow = false;

use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-transient = true;
