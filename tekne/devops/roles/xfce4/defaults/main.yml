---
# defaults file for ./ansible-role-xfce4/

# Hostname resolved by playbook pre-tasks or gathered facts.
xfce4_hostname: >-
  {{ hostname | default(cached_hostname | default(ansible_facts['hostname'])) | upper }}
xfce4_default_group: users
xfce4_users:
  - name: dvaliente
    group: users
  - name: devops
    group: users

# Skip archlinux.org ping loop during arch-chroot install (live ISO already verified network)
xfce4_install_chroot_phase: "{{ install_chroot_phase | default(false) }}"

# XFCE4 package groups (verified with pacman -Qg)
xfce4_groups:
  - xfce4
  - xfce4-goodies

# XFCE4 individual packages (verified with pacman -Q)
xfce4_packages:
  - gnome-keyring
  - seahorse
  - xdg-desktop-portal
  - xdg-desktop-portal-gtk
  - xdg-desktop-portal-xapp
  - libportal
  - bibata-cursor-theme-bin
  - flat-remix
  - kora-icon-theme
  - xorg-server
  - xdotool
  - file-roller
  - gvfs
  - gvfs-afc
  - sound-theme-smooth
  - playerctl
  # Bluetooth support (required for bootstrap role bluetooth config)
  - bluez
  - bluez-utils
  - blueman
  # virt-manager
  - virt-manager
  # VLC
  - vlc
  - vlc-plugin-mpg123
  - vlc-plugin-mpeg2
  - vlc-plugin-x264
  - vlc-plugin-x265
  - vlc-plugin-matroska
  - vlc-plugin-ass
  - vlc-plugins-video-output
  - vlc-plugins-visualization
  - vlc-plugins-extra
  - vlc-plugins-base
  - vlc-plugin-ogg
  - vlc-plugin-notify
  - vlc-plugin-upnp
  - vlc-plugin-mtp
  - vlc-plugin-mad
  - vlc-plugin-gstreamer
  - vlc-plugin-freetype
  - vlc-plugin-flac
  - vlc-plugin-ffmpeg
  - pavucontrol

# LightDM packages (installed on xfce4_lightdm_hosts)
# light-locker omitted: blanks the display for a few seconds after login
xfce4_lightdm_packages:
  - lightdm
  - lightdm-slick-greeter

# Greeters installed by older revisions of this role.
xfce4_lightdm_unused_packages:
  - lightdm-gtk-greeter
  - lightdm-gtk-greeter-settings
  - lightdm-webkit-theme-litarvan
  - lightdm-webkit2-greeter

# Laptop user that receives ACPI media-key events.
xfce4_acpi_user: dvaliente
xfce4_acpi_hosts:
  - ASTER

# Hosts that receive LightDM packages, greeter config, and backgrounds
xfce4_lightdm_hosts:
  - ASTER
  - YUGEN

# LightDM service name
xfce4_lightdm_service: lightdm

# XFCE backgrounds (xfce4_lightdm_hosts only)
xfce4_backgrounds_repo: "https://github.com/tekne-ops/backgrounds"
xfce4_backgrounds_version: deac23607153324f3fe888f8eeb9fb37dcfc8c69
xfce4_backgrounds_dir: "/usr/share/backgrounds/xfce"
xfce4_slick_greeter_background: "/usr/share/backgrounds/xfce/dog-animal-picture-uhdpaper.com-4K-4.3358.jpg"
