---
# tasks file for ansible-role-docker

- name: Create /srv/docker directory
  ansible.builtin.file:
    path: /srv/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - docker-host
    - config

- name: Install Docker packages (docker, docker-compose, docker-buildx)
  community.general.pacman:
    name:
      - docker
      - docker-compose
      - docker-buildx
    state: present
  register: docker_packages_install

- name: Confirm Docker packages are installed
  ansible.builtin.command: pacman -Q docker docker-compose docker-buildx
  register: docker_packages_check
  changed_when: false
  failed_when: docker_packages_check.rc != 0

- name: Ensure /etc/docker directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - docker_packages_check.rc == 0
    - docker_hostname in docker_daemon_json_hosts
  tags:
    - docker-host
    - config

- name: Deploy Docker daemon.json (YUGEN, THEMIS)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: "{{ docker_daemon_json_dest }}"
    owner: root
    group: root
    mode: '0644'
  when:
    - docker_packages_check.rc == 0
    - docker_hostname in docker_daemon_json_hosts
  notify: Restart docker
  tags:
    - docker-host
    - config

- name: Enable and start docker.service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when: docker_packages_check.rc == 0

- name: Flush handlers so daemon.json takes effect before network setup
  ansible.builtin.meta: flush_handlers
  when:
    - docker_packages_check.rc == 0
    - docker_hostname in docker_daemon_json_hosts
  tags:
    - docker-host
    - config

- name: Create Docker application network
  community.docker.docker_network:
    name: "{{ docker_network_name }}"
    state: present
    ipam_config:
      - subnet: "{{ docker_network_subnet }}"
  when: docker_packages_check.rc == 0

- name: Gather local user accounts
  ansible.builtin.getent:
    database: passwd

- name: Add all local users to docker groups
  ansible.builtin.user:
    name: "{{ item.key }}"
    groups: docker
    append: true
  loop: "{{ ansible_facts.getent_passwd | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value[1] | int >= 1000
    - item.value[1] | int < 65534
