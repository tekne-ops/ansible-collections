# SPDX-License-Identifier: MIT-0
---
- name: Install nftables packages
  community.general.pacman:
    name:
      - nftables
    state: present
  register: nftables_packages_install
  tags:
    - nftables
    - packages

- name: Confirm nftables packages are installed
  ansible.builtin.command: pacman -Q nftables
  register: nftables_packages_check
  changed_when: false
  failed_when: nftables_packages_check.rc != 0
  tags:
    - nftables
    - packages

- name: Deploy server nftables config (THEMIS)
  ansible.builtin.copy:
    src: server.conf
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
  when: nftables_hostname in nftables_server_hosts
  notify: reload nftables
  tags:
    - nftables
    - config

- name: Deploy Docker/libvirt workstation nftables config (YUGEN)
  ansible.builtin.copy:
    src: workstation-docker.conf
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
  when:
    - nftables_hostname in nftables_docker_hosts
    - nftables_hostname not in nftables_server_hosts
  notify: reload nftables
  tags:
    - nftables
    - config

- name: Deploy workstation nftables config
  ansible.builtin.copy:
    src: workstation.conf
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
  when: nftables_hostname not in nftables_docker_hosts
  notify: reload nftables
  tags:
    - nftables
    - config

- name: Ensure nftables systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: nftables_hostname in nftables_docker_hosts
  tags:
    - nftables
    - config
    - systemd

- name: Deploy nftables systemd override to preserve Docker rules
  ansible.builtin.copy:
    src: docker-preserve.conf
    dest: /etc/systemd/system/nftables.service.d/docker-preserve.conf
    owner: root
    group: root
    mode: '0644'
  when: nftables_hostname in nftables_docker_hosts
  notify:
    - reload systemd
    - reload nftables
  tags:
    - nftables
    - config
    - systemd

- name: Remove Docker-preserve drop-in on hosts without Docker
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d/docker-preserve.conf
    state: absent
  when: nftables_hostname not in nftables_docker_hosts
  notify: reload systemd
  tags:
    - nftables
    - config
    - systemd

- name: Enable and start nftables.service
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: "{{ 'stopped' if install_chroot_phase | bool else 'started' }}"
    daemon_reload: true
  when: (nftables_packages_check.rc | default(0)) == 0
  tags:
    - nftables
    - systemd
