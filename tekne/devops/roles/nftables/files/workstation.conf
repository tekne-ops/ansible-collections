#!/usr/sbin/nft -f

flush ruleset

# Both interfaces sit on the same LAN. wlan0 is 192.168.135.72 and
# enp0s13f0u3u4 is 192.168.135.30. The USB name follows the port; if the
# dongle moves, update LAN_IFACES. Prefer one of these interfaces for UPnP
# if discovery is flaky: VLC binds to the Wi-Fi address while the USB
# interface has the better route metric.

define LAN_IFACES = { "wlan0", "enp0s13f0u3u4" }
define LAN_NET = 192.168.135.0/24

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Drop garbage, then accept return traffic before any service rule.
        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept

        # Client traffic. DHCP replies and SSH are limited to the LAN
        # interfaces. SSH is also limited to LAN_NET; widen that rule if
        # you connect from another network.
        iifname $LAN_IFACES udp sport 67 udp dport 68 accept comment "DHCPv4 replies"
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept comment "ICMPv4 errors"
        icmpv6 type {
            destination-unreachable,
            packet-too-big,
            time-exceeded,
            parameter-problem,
            nd-router-advert,
            nd-neighbor-solicit,
            nd-neighbor-advert,
            mld-listener-query,
            mld-listener-report,
            mld-listener-done,
            mld2-listener-report
        } accept comment "ICMPv6"

        iifname $LAN_IFACES ip saddr $LAN_NET tcp dport 22 ct state new accept comment "SSH"

        # IPv4 UPnP discovery. Replies to an M-SEARCH are new packets from
        # port 1900, so established,related does not match them.
        iifname $LAN_IFACES ip saddr $LAN_NET udp sport 1900 accept comment "SSDP-replies"
        iifname $LAN_IFACES ip saddr $LAN_NET ip daddr 239.255.255.250 udp dport 1900 accept comment "SSDP-multicast"
        iifname $LAN_IFACES ip saddr $LAN_NET ip protocol igmp accept comment "IGMP"

        # IPv6 UPnP discovery. VLC listens on [::]:1900 and on the wlan0
        # link-local address.
        iifname $LAN_IFACES ip6 saddr fe80::/10 udp sport 1900 accept comment "SSDP6-replies"
        iifname $LAN_IFACES ip6 saddr fe80::/10 ip6 daddr ff02::c udp dport 1900 accept comment "SSDP6-linklocal"
        iifname $LAN_IFACES ip6 saddr fe80::/10 ip6 daddr ff05::c udp dport 1900 accept comment "SSDP6-site"

        # Policy is drop. This only records a sample of what was denied.
        limit rate 5/minute burst 10 packets log prefix "nft-input-drop: " comment "log drops"
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
