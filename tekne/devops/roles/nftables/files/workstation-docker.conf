#!/usr/sbin/nft -f
# YUGEN: workstation input policy, Docker/libvirt forward.
# Do not flush ruleset (systemd drop-in replaces only table inet filter).

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid drop
        iif "lo" accept
        udp sport 67 udp dport 68 accept comment "DHCPv4 replies"
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        iifname virbr0 udp dport { 53, 67 } accept comment "VM dhcp/dns to host"
        ct state established,related accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        iifname "docker0" accept
        iifname "br-*" accept
        oifname "docker0" accept
        oifname "br-*" accept
        iifname "virbr0" accept
        oifname "virbr0" accept
    }
}
