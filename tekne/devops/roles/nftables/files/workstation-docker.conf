#!/usr/sbin/nft -f
# YUGEN: workstation input policy, Docker/libvirt forward.
# Do not flush ruleset (systemd drop-in replaces only table inet filter).

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state invalid drop
        iif "lo" accept
        udp sport 67 udp dport 68 accept comment "DHCPv4 replies"
        udp sport 547 udp dport 546 accept comment "DHCPv6 replies"
        ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        icmpv6 type {
            destination-unreachable,
            packet-too-big,
            time-exceeded,
            parameter-problem,
            nd-router-advert,
            nd-neighbor-solicit,
            nd-neighbor-advert,
            mld-listener-query,
            mld-listener-report,
            mld-listener-done,
            mld2-listener-report
        } accept comment "ICMPv6 for SLAAC and neighbor discovery"
        iifname virbr0 udp dport { 53, 67 } accept comment "VM dhcp/dns to host"
        ct state established,related accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        iifname "docker0" accept
        iifname "br-*" accept
        oifname "docker0" accept
        oifname "br-*" accept
        iifname "virbr0" accept
        oifname "virbr0" accept
    }
}
