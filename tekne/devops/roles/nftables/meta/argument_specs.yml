---
argument_specs:
  main:
    short_description: Host nftables firewall for workstations and servers
    description:
      - Installs nftables and deploys the host firewall policy.
    options:
      nftables_hostname:
        description: The hostname value for the nftables role.
        required: false
        type: str
      nftables_server_hosts:
        description: Hostnames that receive the server firewall.
        required: false
        type: list
        elements: str
        default: []
      nftables_docker_hosts:
        description: Hostnames that receive the Docker workstation firewall when they are not server hosts.
        required: false
        type: list
        elements: str
        default: []
      nftables_install_chroot_phase:
        description: The install chroot phase value for the nftables role.
        required: false
        type: bool
        default: false
