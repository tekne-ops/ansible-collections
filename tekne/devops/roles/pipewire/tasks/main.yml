---
- name: Get user info for home directories
  ansible.builtin.getent:
    database: passwd
    key: "{{ item.name }}"
  loop: "{{ pipewire_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: pipewire_user_info
  tags:
    - pipewire
    - config

- name: Create ~/.config/pipewire/pipewire.conf.d for each user
  ansible.builtin.file:
    path: "{{ item.ansible_facts.getent_passwd[item.item.name][4] }}/.config/pipewire/pipewire.conf.d"
    state: directory
    owner: "{{ item.item.name }}"
    group: "{{ item.item.group | default(pipewire_default_group) }}"
    mode: '0755'
  loop: "{{ pipewire_user_info.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - pipewire
    - config

- name: Create ~/.config/wireplumber/wireplumber.conf.d for each user
  ansible.builtin.file:
    path: "{{ item.ansible_facts.getent_passwd[item.item.name][4] }}/.config/wireplumber/wireplumber.conf.d"
    state: directory
    owner: "{{ item.item.name }}"
    group: "{{ item.item.group | default(pipewire_default_group) }}"
    mode: '0755'
  loop: "{{ pipewire_user_info.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - pipewire
    - config

- name: Copy pipewire.conf to 99-audio-quality.conf
  ansible.builtin.copy:
    src: pipewire.conf
    dest: "{{ item.ansible_facts.getent_passwd[item.item.name][4] }}/.config/pipewire/pipewire.conf.d/99-audio-quality.conf"
    owner: "{{ item.item.name }}"
    group: "{{ item.item.group | default(pipewire_default_group) }}"
    mode: '0644'
  loop: "{{ pipewire_user_info.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - pipewire
    - config

- name: Copy 50-bluetooth-quality.conf to wireplumber
  ansible.builtin.copy:
    src: 50-bluetooth-quality.conf
    dest: "{{ item.ansible_facts.getent_passwd[item.item.name][4] }}/.config/wireplumber/wireplumber.conf.d/50-bluetooth-quality.conf"
    owner: "{{ item.item.name }}"
    group: "{{ item.item.group | default(pipewire_default_group) }}"
    mode: '0644'
  loop: "{{ pipewire_user_info.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - pipewire
    - config

- name: Copy 60-volume-boost.conf to wireplumber
  ansible.builtin.copy:
    src: 60-volume-boost.conf
    dest: "{{ item.ansible_facts.getent_passwd[item.item.name][4] }}/.config/wireplumber/wireplumber.conf.d/60-volume-boost.conf"
    owner: "{{ item.item.name }}"
    group: "{{ item.item.group | default(pipewire_default_group) }}"
    mode: '0644'
  loop: "{{ pipewire_user_info.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - pipewire
    - config

- name: Copy 99-ldac.conf to wireplumber
  ansible.builtin.copy:
    src: 99-ldac.conf
    dest: "{{ item.ansible_facts.getent_passwd[item.item.name][4] }}/.config/wireplumber/wireplumber.conf.d/99-ldac.conf"
    owner: "{{ item.item.name }}"
    group: "{{ item.item.group | default(pipewire_default_group) }}"
    mode: '0644'
  loop: "{{ pipewire_user_info.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - pipewire
    - config

- name: Copy HD 660S EQ sink to pipewire.conf.d
  ansible.builtin.copy:
    src: sink-eq06-sony.conf
    dest: "{{ item.ansible_facts.getent_passwd[item.item.name][4] }}/.config/pipewire/pipewire.conf.d/sink-eq06.conf"
    owner: "{{ item.item.name }}"
    group: "{{ item.item.group | default(pipewire_default_group) }}"
    mode: '0644'
  loop: "{{ pipewire_user_info.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - pipewire
    - config

- name: Remove limiter drop-in from pipewire.conf.d
  ansible.builtin.file:
    path: "{{ item.ansible_facts.getent_passwd[item.item.name][4] }}/.config/pipewire/pipewire.conf.d/60-soft-limiter.conf"
    state: absent
  loop: "{{ pipewire_user_info.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - pipewire
    - config

- name: Remove misplaced LDAC drop-in from pipewire.conf.d
  ansible.builtin.file:
    path: "{{ item.ansible_facts.getent_passwd[item.item.name][4] }}/.config/pipewire/pipewire.conf.d/99-ldac.conf"
    state: absent
  loop: "{{ pipewire_user_info.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  tags:
    - pipewire
    - config
