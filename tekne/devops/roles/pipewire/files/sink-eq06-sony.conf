# Optional 7-band sink (Sennheiser HD 660S). Select "Sennheiser HD 660S EQ"
# in pavucontrol; it is not the default output.
#
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Sennheiser HD 660S EQ"
            media.name       = "Sennheiser HD 660S EQ"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_highshelf
                        control = { "Freq" = 0 "Q" = 1.0 "Gain" = -1.4 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_lowshelf
                        control = { "Freq" = 110.0 "Q" = 0.71 "Gain" = 1.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 950.0 "Q" = 1.4 "Gain" = 0.9 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 1950.0 "Q" = 1.2 "Gain" = -3.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_highshelf
                        control = { "Freq" = 2000.0 "Q" = 0.71 "Gain" = 2.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_peaking
                        control = { "Freq" = 5100.0 "Q" = 3.0 "Gain" = -2.4 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_7
                        label = bq_highshelf
                        control = { "Freq" = 10000.0 "Q" = 0.71 "Gain" = -4.0 }
                    }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                ]
                inputs = [ "eq_band_1:In" ]
                outputs = [ "eq_band_7:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.eq6"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name    = "effect_output.eq6"
                node.passive = true
            }
        }
    }
]
