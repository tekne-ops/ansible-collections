wireplumber.settings = {
    bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
    # 96 kHz LDAC overruns the radio. Keep the A2DP link at 48 kHz.
    bluez5.default.rate = 48000
    bluez5.roles = [ a2dp_sink a2dp_source ]

    bluez5.codecs = [
        ldac
        aptx_hd
        aptx
        aac
        sbc_xq
        sbc
    ]
}

monitor.bluez.rules = [
    {
        matches = [
            {
                device.name = "~bluez_card.*"
            }
        ]
        actions = {
            update-props = {
                # Fixed 990/909 kbps. The link stays at 48 kHz so HQ does not also carry 96 kHz.
                bluez5.a2dp.ldac.quality = "hq"
            }
        }
    }
    {
        matches = [
            {
                node.name = "~bluez_output.*"
            }
            {
                node.name = "~bluez_input.*"
            }
        ]
        actions = {
            update-props = {
                resample.quality = 4
            }
        }
    }
]
