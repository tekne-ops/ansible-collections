wireplumber.settings = {
    bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
    # LDAC's highest rate. A device that cannot do 96 kHz negotiates downward.
    bluez5.default.rate = 96000
    bluez5.roles = [ a2dp_sink a2dp_source ]

    bluez5.codecs = [
        ldac
        aptx_hd
        aptx
        aac
        sbc_xq
        sbc
    ]
}

monitor.bluez.rules = [
    {
        matches = [
            {
                device.name = "~bluez_card.*"
            }
        ]
        actions = {
            update-props = {
                # Highest LDAC mode: 990 kbps at 96 kHz, 909 kbps at 88.2 kHz.
                bluez5.a2dp.ldac.quality = "hq"
            }
        }
    }
    {
        matches = [
            {
                node.name = "~bluez_output.*"
            }
            {
                node.name = "~bluez_input.*"
            }
        ]
        actions = {
            update-props = {
                resample.quality = 10
            }
        }
    }
]
