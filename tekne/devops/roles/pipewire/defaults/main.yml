---
# Fallback when pipewire runs without the user role in the same play
pipewire_default_group: users

# Skip user-service restarts while arch-install is still in the chroot
pipewire_install_chroot_phase: "{{ install_chroot_phase | default(false) }}"

# Codec libraries required by the Bluetooth drop-in
pipewire_codec_packages:
  - libldac
  - libfreeaptx

pipewire_user_services:
  - pipewire.service
  - pipewire-pulse.service
  - wireplumber.service

pipewire_users:
  - name: dvaliente
    group: users
    hd660s_eq: true
  - name: devops
    group: users
