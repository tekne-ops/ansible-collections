---
argument_specs:
  main:
    short_description: PipeWire and WirePlumber user configuration
    description:
      - Deploys PipeWire and WirePlumber configuration for each user.
    options:
      pipewire_default_group:
        description: Fallback when pipewire runs without the user role in the same play.
        required: false
        type: str
        default: users
      pipewire_install_chroot_phase:
        description: Skip the network wait and user-service restart during arch-install chroot.
        required: false
        type: bool
        default: false
      pipewire_codec_packages:
        description: Bluetooth codec libraries installed for the WirePlumber drop-in.
        required: false
        type: list
        elements: str
        default:
          - libldac
          - libfreeaptx
      pipewire_user_services:
        description: User services restarted after a configuration change when a session is running.
        required: false
        type: list
        elements: str
        default:
          - pipewire.service
          - pipewire-pulse.service
          - wireplumber.service
      pipewire_users:
        description: The users value for the pipewire role.
        required: false
        type: list
        elements: dict
        options:
          name:
            description: The name field on each list entry.
            required: false
            type: str
          group:
            description: The group field on each list entry.
            required: false
            type: str
          hd660s_eq:
            description: Deploy the Sennheiser HD 660S filter-chain sink for this user.
            required: false
            type: bool
            default: false
        default:
          - name: dvaliente
            group: users
            hd660s_eq: true
          - name: devops
            group: users
