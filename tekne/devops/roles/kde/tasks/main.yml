---
# tasks file for ./kde

# =============================================================================
# Network Connectivity Check
# =============================================================================

- name: Wait for network connectivity before package installation
  ansible.builtin.command:
    cmd: ping -c 1 -W 2 archlinux.org
  register: kde_network_check
  until: kde_network_check.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  when: not kde_install_chroot_phase | bool
  tags:
    - kde
    - network
    - packages

# =============================================================================
# Package Installation
# =============================================================================

- name: Install KDE Plasma packages
  community.general.pacman:
    name: "{{ kde_packages }}"
    state: present
    extra_args: '--noconfirm --needed'
  register: kde_packages_install_result
  tags:
    - kde
    - packages

# =============================================================================
# Display manager (plasma-login-manager)
# =============================================================================

- name: Enable plasmalogin.service without changing its runtime state
  ansible.builtin.systemd:
    name: "{{ kde_login_service }}"
    enabled: true
  tags:
    - kde
    - service

# =============================================================================
# Verification
# =============================================================================

- name: Verify KDE packages are installed
  ansible.builtin.command:
    cmd: "pacman -Q {{ item }}"
  loop: "{{ kde_packages }}"
  register: kde_package_verify
  changed_when: false
  failed_when: kde_package_verify.rc != 0
  tags:
    - kde
    - verify

- name: Inspect plasmalogin.service state
  ansible.builtin.systemd:
    name: "{{ kde_login_service }}"
  register: kde_login_service_status
  tags:
    - kde
    - verify
    - service

- name: Verify plasmalogin.service is enabled
  ansible.builtin.assert:
    that:
      - kde_login_service_status.status.UnitFileState == 'enabled'
    fail_msg: "{{ kde_login_service }} is not enabled"
  tags:
    - kde
    - verify
    - service

- name: Display KDE installation result
  ansible.builtin.debug:
    msg: >-
      KDE packages installed: {{ kde_packages_install_result is success }},
      {{ kde_login_service }} enabled:
      {{ kde_login_service_status.status.UnitFileState }},
      {{ kde_login_service }} active:
      {{ kde_login_service_status.status.ActiveState }}
  tags:
    - kde
    - verify
