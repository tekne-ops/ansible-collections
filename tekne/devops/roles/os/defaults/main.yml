---
# defaults file for os role

# Hostname (resolved from playbook pre_tasks)
os_hostname: >-
  {{ hostname | default(cached_hostname | default(ansible_facts['hostname'])) | upper }}
os_hostname_raw: "{{ cached_hostname_raw | default(ansible_facts['hostname']) }}"

# During arch-chroot install: enable units but do not start services (PID 1 is live ISO)
os_install_chroot_phase: "{{ install_chroot_phase | default(false) }}"

# Host profiles choose the governor and which hosts start these units.
os_cpupower_governor: schedutil
os_cpupower_start_hosts: []
os_cpupower_skip_hosts: []
os_irqbalance_start_hosts: []
os_manage_server_services: false

# Clone private tekne repos under /srv/code when git_token is in vault (skip otherwise)
os_clone_tekne_repos: "{{ git_token is defined and git_token | string | trim | length > 0 }}"

# Locale settings
os_locale: en_US.UTF-8

# Steady-state mirror policy. reflector.timer reads the rendered
# /etc/xdg/reflector/reflector.conf. No country filter: throughput is not
# the same as distance, and this network is not in the United States.
# The installer ranks a smaller set before pacstrap; see arch-install.sh.
os_mirror_protocols: https
os_mirror_age: 24
os_mirror_latest: 20
os_mirror_number: 10
os_mirror_sort: rate
os_parallel_downloads: 5
os_pacman_noextract: etc/pacman.d/mirrorlist

# THEMIS-only: local .pkg.tar.zst packages (place in role files/)
os_themis_local_packages:
  - pikaur-1.33.2-1-any.pkg.tar.zst
  - schedtoold-0.3-11-x86_64.pkg.tar.zst
  - blesh-git-0.4.0_devel4.r2307.32bb63da-1-any.pkg.tar.zst
  - python311-3.11.14-1-x86_64.pkg.tar.zst
