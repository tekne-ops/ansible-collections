---
# Hostname (from playbook pre_tasks / hostname role)
network_hostname: "{{ hostname | default(ansible_facts['hostname']) | upper }}"
network_hostname_raw: "{{ cached_hostname_raw | default(ansible_facts['hostname']) }}"

# WiFi .network unit: ASTER only (iwd). Ethernet: workstations/VMs, not THEMIS (br0).
network_wifi_hosts:
  - ASTER
network_ethernet_hosts:
  - ASTER
  - YUGEN
  - KVM
network_config_hosts: "{{ (network_wifi_hosts + network_ethernet_hosts) | unique }}"

# WiFi (ASTER only); set passphrase in vault
network_wifi_ssid: "{{ os_wifi_ssid | default('esher') }}"
network_wifi_interface: "{{ os_wifi_interface | default('') }}"
network_wifi_passphrase: "{{ os_wifi_passphrase | default('') }}"
network_wifi_driver_module: mt7925e
network_wifi_detect_retries: 30
network_wifi_detect_delay: 2

# Live WiFi association via iwctl (disable during arch-chroot install; config still deploys)
network_connect_wifi: true

# Packages that provide the ASTER services managed by this role. Keep these
# here instead of relying on a later desktop role to provide their unit files.
network_laptop_service_packages:
  - bluez
  - iwd
  - thermald
  - tlp
  - bolt

# Skip archlinux.org ping loop during arch-chroot install (live ISO already verified network)
network_install_chroot_phase: "{{ install_chroot_phase | default(false) }}"

# DNS (single drop-in: /etc/systemd/resolved.conf.d/95-dns.conf)
network_resolved_manage: true
# ASTER: DHCP nameservers from the router, contacted only with strict DoT.
# Other hosts: pin Quad9 then Google (Cablecolor/Tigo drop port 53; Tigo blocks 1.1.1.1:853).
network_dns_from_dhcp: "{{ network_hostname == 'ASTER' }}"
network_dns_servers:
  - 9.9.9.9#dns.quad9.net
  - 149.112.112.112#dns.quad9.net
  - 8.8.8.8#dns.google
  - 8.8.4.4#dns.google
# Empty list writes FallbackDNS= and clears systemd's compiled-in 1.1.1.1/8.8.8.8 list.
network_dns_fallback: []
network_dns_search_domains:
  - tekne.sv
network_dns_over_tls: 'yes'
network_dnssec: 'no'
network_dns_cache: 'yes'
network_dhcp_use_dns: "{{ 'yes' if network_dns_from_dhcp | bool else 'no' }}"
network_dhcp_use_domains: 'no'
network_dns_default_route: "{{ 'yes' if network_dns_from_dhcp | bool else 'no' }}"
