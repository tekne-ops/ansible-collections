---
argument_specs:
  main:
    short_description: systemd-networkd, WiFi, DNS policy, and the THEMIS bridge
    description:
      - Configures systemd-networkd, WiFi, DNS, and the THEMIS bridge.
    options:
      network_hostname:
        description: Hostname (from playbook pre_tasks / hostname role).
        required: false
        type: str
      network_hostname_raw:
        description: Case-sensitive hostname shown in debug output. Network units are not matched on Host=.
        required: false
        type: str
      network_manage_bridge:
        description: Deploy the br0 bridge units and the SSH drop-in.
        required: false
        type: bool
        default: false
      network_manage_laptop:
        description: Install laptop services and connect Wi-Fi when network_connect_wifi is true.
        required: false
        type: bool
        default: false
      network_wifi_hosts:
        description: Hostnames that receive the iwd Wi-Fi .network unit.
        required: false
        type: list
        elements: str
        default: []
      network_ethernet_hosts:
        description: Hostnames that receive the Ethernet .network unit.
        required: false
        type: list
        elements: str
        default: []
      network_config_hosts:
        description: The config hosts value for the network role.
        required: false
        type: list
        elements: str
      network_wifi_ssid:
        description: WiFi (ASTER only); set passphrase in vault.
        required: false
        type: str
      network_wifi_interface:
        description: The wifi interface value for the network role.
        required: false
        type: str
      network_wifi_passphrase:
        description: The wifi passphrase value for the network role.
        required: false
        type: str
        no_log: true
      network_wifi_driver_module:
        description: The wifi driver module value for the network role.
        required: false
        type: str
        default: mt7925e
      network_wifi_detect_retries:
        description: The wifi detect retries value for the network role.
        required: false
        type: int
        default: 30
      network_wifi_detect_delay:
        description: The wifi detect delay value for the network role.
        required: false
        type: int
        default: 2
      network_connect_wifi:
        description: Live WiFi association via iwctl (disable during arch-chroot install; config still deploys).
        required: false
        type: bool
        default: true
      network_laptop_service_packages:
        description: Packages that provide the ASTER systemd services managed by this role.
        required: false
        type: list
        elements: str
        default:
          - bluez
          - iwd
          - thermald
          - tlp
          - bolt
      network_install_chroot_phase:
        description: Skip the live IPv4 and DNS check during arch-chroot install (live ISO already verified network).
        required: false
        type: bool
        default: false
      network_resolved_manage:
        description: 'DNS (single drop-in: /etc/systemd/resolved.conf.d/95-dns.conf).'
        required: false
        type: bool
        default: true
      network_dns_from_dhcp:
        description:
          - When false (default on every host), pin Quad9 then Google and ignore DHCP DNS.
          - Cablecolor/Tigo drop much of port 53; Tigo blocks 1.1.1.1:853.
        required: false
        type: bool
        default: false
      network_dns_servers:
        description: The dns servers value for the network role.
        required: false
        type: list
        elements: str
        default:
          - 9.9.9.9#dns.quad9.net
          - 149.112.112.112#dns.quad9.net
          - 8.8.8.8#dns.google
          - 8.8.4.4#dns.google
      network_dns_fallback:
        description: The dns fallback value for the network role.
        required: false
        type: list
        elements: str
        default: []
      network_dns_search_domains:
        description: Search suffixes written to resolved Domains=.
        required: false
        type: list
        elements: str
        default:
          - tekne.sv
      network_dns_route_domains:
        description: Route-only domains appended to resolved Domains=. "~." makes the pinned resolvers the default DNS route.
        required: false
        type: list
        elements: str
        default:
          - "~."
      network_dns_llmnr:
        description: Global and per-link LLMNR setting.
        required: false
        type: str
        default: 'no'
      network_dns_stale_retention_sec:
        description: How long resolved may serve expired cache records.
        required: false
        type: str
        default: 30min
      network_ipv6_accept_ra:
        description: Accept IPv6 router advertisements on Wi-Fi, Ethernet, and br0.
        required: false
        type: bool
        default: true
      network_ipv6_privacy_extensions:
        description: IPv6 privacy extensions on Wi-Fi and Ethernet. br0 stays stable.
        required: false
        type: str
        default: 'yes'
      network_dns_over_tls:
        description: The dns over tls value for the network role.
        required: false
        type: str
        default: 'yes'
      network_dnssec:
        description: The dnssec value for the network role.
        required: false
        type: str
        default: 'no'
      network_dns_cache:
        description: The dns cache value for the network role.
        required: false
        type: str
        default: 'yes'
      network_dhcp_use_dns:
        description: The dhcp use dns value for the network role.
        required: false
        type: str
      network_dhcp_use_domains:
        description: The dhcp use domains value for the network role.
        required: false
        type: str
        default: 'no'
      network_dns_default_route:
        description: The dns default route value for the network role.
        required: false
        type: str
