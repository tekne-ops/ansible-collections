# SPDX-License-Identifier: MIT-0
---
# Binary containerd, runc, and CNI plugins (upstream releases).
# Runs after kubelet is enabled and ensures containerd is ready for kubeadm.

- name: Ensure containerd install directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ k8s_containerd_install_prefix }}"
    - "{{ k8s_containerd_install_prefix }}/sbin"
    - "{{ k8s_containerd_unit_path | dirname }}"
    - "{{ k8s_cni_bin_dir }}"
  tags:
    - k8s
    - k8s-containerd

- name: Check installed containerd binary
  ansible.builtin.stat:
    path: "{{ k8s_containerd_install_prefix }}/bin/containerd"
  register: k8s_containerd_binary
  tags:
    - k8s
    - k8s-containerd

- name: Download containerd release tarball
  ansible.builtin.get_url:
    url: "{{ k8s_containerd_tarball_url }}"
    dest: "{{ k8s_containerd_tarball_dest }}"
    mode: "0644"
    checksum: "sha256:{{ k8s_containerd_checksums[k8s_containerd_arch] }}"
  register: k8s_containerd_download
  tags:
    - k8s
    - k8s-containerd

- name: Extract containerd binaries to {{ k8s_containerd_install_prefix }}
  ansible.builtin.unarchive:
    src: "{{ k8s_containerd_tarball_dest }}"
    dest: "{{ k8s_containerd_install_prefix }}"
    remote_src: true
  when: k8s_containerd_download is changed or not k8s_containerd_binary.stat.exists
  notify: Restart containerd
  tags:
    - k8s
    - k8s-containerd

- name: Install containerd systemd unit file
  ansible.builtin.get_url:
    url: "{{ k8s_containerd_service_url }}"
    dest: "{{ k8s_containerd_unit_path }}"
    mode: "0644"
    owner: root
    group: root
  notify: Restart containerd
  tags:
    - k8s
    - k8s-containerd

- name: Enable containerd service without changing its runtime state
  ansible.builtin.systemd:
    name: "{{ k8s_containerd_service }}"
    enabled: true
  tags:
    - k8s
    - k8s-containerd
    - k8s-services

- name: Download runc binary
  ansible.builtin.get_url:
    url: "{{ k8s_runc_url }}"
    dest: "{{ k8s_runc_download_dest }}"
    mode: "0755"
    checksum: "sha256:{{ k8s_runc_checksums[k8s_containerd_arch] }}"
  tags:
    - k8s
    - k8s-containerd
    - k8s-runc

- name: Install runc to {{ k8s_runc_install_path }}
  ansible.builtin.copy:
    src: "{{ k8s_runc_download_dest }}"
    dest: "{{ k8s_runc_install_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart containerd
  tags:
    - k8s
    - k8s-containerd
    - k8s-runc

- name: Download CNI plugins archive
  ansible.builtin.get_url:
    url: "{{ k8s_cni_plugins_url }}"
    dest: "{{ k8s_cni_plugins_dest }}"
    mode: "0644"
    checksum: "sha256:{{ k8s_cni_plugins_checksums[k8s_cni_plugins_arch] }}"
  register: k8s_cni_download
  tags:
    - k8s
    - k8s-containerd
    - k8s-cni

- name: Extract CNI plugins to {{ k8s_cni_bin_dir }}  # noqa no-handler
  ansible.builtin.unarchive:
    src: "{{ k8s_cni_plugins_dest }}"
    dest: "{{ k8s_cni_bin_dir }}"
    remote_src: true
  when: k8s_cni_download is changed
  notify: Restart containerd
  tags:
    - k8s
    - k8s-containerd
    - k8s-cni

- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: "{{ k8s_containerd_config_dir }}"
    state: directory
    mode: "0755"
  tags:
    - k8s
    - k8s-containerd
    - k8s-containerd-config

- name: Write default containerd configuration
  ansible.builtin.shell: |
    set -o pipefail
    {{ k8s_containerd_bin }} config default > {{ k8s_containerd_config_path }}
  args:
    executable: /bin/bash
    creates: "{{ k8s_containerd_config_path }}"
  notify: Restart containerd
  tags:
    - k8s
    - k8s-containerd
    - k8s-containerd-config

- name: Enable systemd cgroup driver in containerd config
  ansible.builtin.replace:
    path: "{{ k8s_containerd_config_path }}"
    regexp: 'SystemdCgroup\s*=\s*false'
    replace: "SystemdCgroup = true"
  notify: Restart containerd
  tags:
    - k8s
    - k8s-containerd
    - k8s-containerd-config

- name: Set Kubernetes sandbox (pause) image in containerd config
  ansible.builtin.lineinfile:
    path: "{{ k8s_containerd_config_path }}"
    insertafter: '^\s*{{ k8s_containerd_sandbox_insert_after }}\s*='
    line: '    sandbox_image = "{{ k8s_containerd_sandbox_image }}"'
    regexp: '^\s*sandbox_image\s*='
  notify: Restart containerd
  tags:
    - k8s
    - k8s-containerd
    - k8s-containerd-config

- name: Apply pending containerd changes before kubeadm
  ansible.builtin.meta: flush_handlers
  tags:
    - k8s
    - k8s-containerd
    - k8s-containerd-config
    - k8s-services

- name: Ensure containerd is running
  ansible.builtin.systemd:
    name: "{{ k8s_containerd_service }}"
    state: started
    enabled: true
  tags:
    - k8s
    - k8s-containerd
    - k8s-containerd-config
    - k8s-services
