---
- name: Verify the hostname role converges without changes
  hosts: localhost
  connection: local
  gather_facts: true

  roles:
    - role: tekne.devops.hostname

  post_tasks:
    - name: Verify the hostname fact is available
      ansible.builtin.assert:
        that:
          - cached_hostname | length > 0
          - hostname | length > 0
