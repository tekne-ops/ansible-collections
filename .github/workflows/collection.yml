---
name: tekne.devops quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.19.0,<2.22" ansible-lint yamllint

      - name: Install collection dependencies
        working-directory: tekne/devops
        run: |
          ansible-galaxy collection install \
            --collections-path "${GITHUB_WORKSPACE}/.ci-collections" \
            -r requirements.yml

      - name: Confirm the collection layout Ansible searches
        run: test -f "${GITHUB_WORKSPACE}/ansible_collections/tekne/devops/galaxy.yml"

      - name: Yamllint
        run: yamllint -c .yamllint tekne/devops .github

      - name: Hardening regression tests
        run: python tekne/devops/tests/test_hardening.py

      - name: Ansible lint
        working-directory: tekne/devops
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}:${{ github.workspace }}/.ci-collections
        run: ansible-lint -c "${GITHUB_WORKSPACE}/.ansible-lint"

      - name: Build the collection
        working-directory: tekne/devops
        run: ansible-galaxy collection build --force --output-path "${GITHUB_WORKSPACE}/.build"

      - name: Syntax-check role tests
        working-directory: tekne/devops
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}:${{ github.workspace }}/.ci-collections
        run: |
          set -euo pipefail
          status=0
          for play in roles/*/tests/test.yml; do
            echo "syntax-check ${play}"
            ansible-playbook "${play}" --syntax-check || status=1
          done
          exit "${status}"

      - name: Execute idempotence checks
        working-directory: tekne/devops
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}:${{ github.workspace }}/.ci-collections
        run: |
          set -euo pipefail
          ansible-playbook tests/hostname_idempotence.yml -i localhost,
          ansible-playbook tests/hostname_idempotence.yml -i localhost, | tee /tmp/idempotence-hostname.log
          grep -Eq 'changed=0 .*failed=0' /tmp/idempotence-hostname.log
          ansible-playbook tests/render_idempotence.yml -i localhost,
          ansible-playbook tests/render_idempotence.yml -i localhost, | tee /tmp/idempotence-render.log
          grep -Eq 'changed=0 .*failed=0' /tmp/idempotence-render.log

      - name: Sanity checks
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}:${{ github.workspace }}/.ci-collections
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/ansible_collections/tekne/devops"
          ansible-test sanity --local --python 3.12 \
            --test runtime-metadata \
            --test changelog \
            --test ansible-doc \
            --test compile \
            --test empty-init \
            --test line-endings \
            --test symlinks \
            --test no-illegal-filenames
